name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build game page from web source
        shell: pwsh
        run: ./tools/build-web.ps1

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RohanChase.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RohanChase-apk
          path: RohanChase.apk

      # every push to main becomes a release with the APK attached, ready to download on a phone
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" RohanChase.apk \
            --title "Rohan Chase 1.0.${{ github.run_number }}" \
            --notes "Pobierz RohanChase.apk na telefonie z Androidem i zainstaluj (zezwól na instalację z nieznanych źródeł)." \
            --latest
